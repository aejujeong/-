
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인간다움 - 의식 가이드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>
    <script>
      // Netlify 등 배포 환경에서 주입되는 API_KEY를 안전하게 받기 위한 설정
      window.process = window.process || { env: {} };
      window.process.env = window.process.env || {};
      // 환경변수가 문자열 그대로 노출되는 것을 방지하면서, 비어있을 경우에만 초기화
      if (typeof window.process.env.API_KEY === 'undefined') {
        window.process.env.API_KEY = "";
      }
      
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Pretendard Variable', 'Pretendard', 'sans-serif'],
              serif: ['Noto Serif KR', 'serif'],
            },
            colors: {
              growth: { blue: '#3B59FF', deep: '#0F111A', light: '#E9EEF6' },
              cosmic: { bg: '#E9EEF6', panel: '#FFFFFF', accent: '#3B59FF', text: '#0F111A' }
            },
            boxShadow: {
              'premium': '0 20px 40px -10px rgba(15, 17, 26, 0.08), 0 8px 16px -4px rgba(0, 0, 0, 0.03)',
              'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.02)',
            }
          }
        }
      }
    </script>
    <style>
        :root { --zen-bg: #E9EEF6; --zen-text: #0F111A; }
        body { background-color: var(--zen-bg); color: var(--zen-text); overflow: hidden; font-family: 'Pretendard Variable', sans-serif; letter-spacing: -0.015em; -webkit-font-smoothing: antialiased; }
        .bento-card { background: #FFFFFF; border-radius: 2.5rem; box-shadow: theme('boxShadow.premium'); border: 1px solid rgba(15, 17, 26, 0.02); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .pattern-nebula { background: radial-gradient(circle at 50% -10%, rgba(59, 89, 255, 0.08), transparent 60%), radial-gradient(circle at 5% 95%, rgba(59, 89, 255, 0.04), transparent 40%); }
        .bottom-nav-blur { backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); background: rgba(255, 255, 255, 0.92); border-top: 1px solid rgba(15, 17, 26, 0.04); }
        .text-meta { font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; font-size: 10px; color: #94A3B8; }
        .h-18 { height: 4.5rem; }
        .w-18 { width: 4.5rem; }
        .animate-in { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="pattern-nebula">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
